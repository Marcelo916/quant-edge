[project]
name = "quant-edge"
version = "0.1.0"
description = "A quantative trading research platform for systematic trading, machine learning, backtesting, and portfolio optimization."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marcelo916", email = "161655728+Marcelo916@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "yfinance>=1.8.0",
]

[project.scripts]
quant-edge = "quant_edge:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
